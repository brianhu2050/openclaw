<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="1000" fill="#f8fafc" />

  <text x="500" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b" text-anchor="middle">OpenClaw Agent Loop 详细流程 (Deep Dive)</text>

  <!-- Start -->
  <circle cx="500" cy="100" r="20" fill="#10b981" />
  <text x="500" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">Run Start</text>

  <!-- Step 1: Context Assembly -->
  <rect x="300" y="170" width="400" height="120" rx="8" fill="white" stroke="#3b82f6" stroke-width="2"/>
  <text x="500" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">1. 上下文组装 (Context Assembly)</text>
  <g font-family="Arial, sans-serif" font-size="12" fill="#475569">
    <text x="320" y="225">· Load Session History (Transcript)</text>
    <text x="320" y="245">· Inject System Prompt &amp; Soul.md</text>
    <text x="320" y="265">· Resolve &amp; Inject Eligible Skills (XML format)</text>
  </g>

  <!-- Step 2: Model Inference -->
  <rect x="300" y="320" width="400" height="80" rx="8" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  <text x="500" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6d28d9" text-anchor="middle">2. 模型推理 (LLM Inference)</text>
  <text x="500" y="375" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Stream deltas from pi-agent-core</text>

  <!-- Step 3: Stream Handling -->
  <rect x="100" y="430" width="350" height="150" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-dasharray="5,5"/>
  <text x="275" y="455" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">3a. 流式处理 (Stream Handling)</text>
  <g font-family="Arial, sans-serif" font-size="12" fill="#475569">
    <text x="120" y="485">· Block Chunking (Paragraph/Fenced)</text>
    <text x="120" y="505">· Reasoning Extraction (Thought stream)</text>
    <text x="120" y="525">· Soft-chunk Flush Policy</text>
    <text x="120" y="545">· Forward to WebSocket Events</text>
  </g>

  <!-- Step 4: Tool Execution Pipeline -->
  <rect x="550" y="430" width="350" height="220" rx="8" fill="#fff7ed" stroke="#f97316"/>
  <text x="725" y="455" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">3b. 工具执行管道 (Tool Pipeline)</text>
  <g font-family="Arial, sans-serif" font-size="12" fill="#475569">
    <text x="570" y="485" font-weight="bold">· before_tool_call hook</text>
    <text x="570" y="505">· Policy Check (Allow/Deny list)</text>
    <text x="570" y="525">· Execution Context (Host vs Sandbox)</text>
    <text x="570" y="545">· Result Sanitization (Size limit)</text>
    <text x="570" y="565" font-weight="bold">· tool_result_persist hook</text>
    <text x="570" y="585">· Append to Transcript (Stable Save)</text>
    <text x="570" y="605">· Loop Detection (Self-correction)</text>
  </g>

  <!-- Step 5: Compaction & Retry -->
  <rect x="300" y="700" width="400" height="100" rx="8" fill="white" stroke="#ef4444" stroke-width="2"/>
  <text x="500" y="725" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">4. 压缩与重试 (Compaction/Retry)</text>
  <g font-family="Arial, sans-serif" font-size="12" fill="#475569">
    <text x="320" y="755">· Context Overflow Detection</text>
    <text x="320" y="775">· Auto-Compaction Cycle (Summary gen)</text>
  </g>

  <!-- End -->
  <rect x="400" y="850" width="200" height="60" rx="8" fill="#10b981" stroke="#059669"/>
  <text x="500" y="885" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Run End / Persistence</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <line x1="500" y1="120" x2="500" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="290" x2="500" y2="315" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Inference to Stream/Tool -->
  <path d="M 500 400 L 500 415 L 275 415 L 275 430" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 500 400 L 500 415 L 725 415 L 725 430" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Loop back from Tool to Inference (mental flow) -->
  <path d="M 900 540 L 950 540 L 950 360 L 705 360" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>
  <text x="960" y="450" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8" transform="rotate(90 960 450)">Multi-turn logic</text>

  <line x1="275" y1="580" x2="480" y2="695" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="725" y1="650" x2="520" y2="695" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="800" x2="500" y2="845" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

</svg>
